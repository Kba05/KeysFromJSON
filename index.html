<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keys from JSON — keys, paths, types and graph</title>
    <meta name="description" content="Paste JSON and turn it into key lists, paths, schemas, generated types, or an interactive graph. Everything stays in your browser." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f6bed" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:title" content="Keys from JSON" />
    <meta property="og:description" content="Explore JSON as keys, paths, generated code, schemas, and an interactive graph." />
    <meta property="og:type" content="website" />
    <script>
      (() => {
        try {
          const modern = JSON.parse(localStorage.getItem('kfj.app.v3') || 'null');
          const stored = modern?.state?.theme || localStorage.getItem('kfj.theme');
          const theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch { /* light mode remains a safe fallback */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
